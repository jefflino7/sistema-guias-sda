<style>
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7c; --line:#e3e7ec; --grid:#eef1f4;
  --nav:#121231; --nav-ink:#c9d3e3; --accent:#0f7b6c; --accent-2:#e6f4f1;
  --warn:#9a4a05; --warn-bg:#fff4e0; --err:#b42318; --err-bg:#fdecea; --ok:#147a3d; --ok-bg:#e7f6ec;
  --blue:#1d4ed8; --blue-bg:#e8efff; --violet:#6d28d9; --violet-bg:#f1eafe;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:var(--nav);color:var(--nav-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{color:#fff;font-weight:700;font-size:17px;padding:0 8px 2px}
nav .sub{font-size:12px;padding:0 8px 16px;opacity:.75}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;padding:12px 10px 4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;text-align:left;padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.07)}
nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
nav .num{margin-left:auto;background:#f59e0b;color:#1b2430;border-radius:10px;padding:0 7px;font-size:12px;font-weight:700}
nav .foot{font-size:11.5px;opacity:.8;padding:16px 8px 0;line-height:1.5}
nav .foot button{display:inline-block;width:auto;background:#fff;color:#1b2430;padding:5px 10px;margin-top:6px}
main{padding:22px 26px 60px;min-width:0}
h1{font-size:21px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13.5px;margin:0 0 8px;color:#334155}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.kpi .v{font-size:clamp(17px,1.6vw,23px);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#b9c4d0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:inherit;border:1px solid #c8d0da;border-radius:7px;padding:6px 8px;background:#fff}
input:focus,select:focus{outline:2px solid #9bd3c9;border-color:var(--accent)}
input.sm,select.sm{padding:3px 6px;font-size:13px}
input.num{text-align:right;width:96px}
button.b{font:inherit;border:1px solid #c8d0da;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;color:var(--ink)}
button.b:hover{background:#f1f4f7}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.p:hover{background:#0c6a5d}
button.d{color:var(--err);border-color:#efc2bd}
button.d:hover{background:var(--err-bg)}
button.b:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font:inherit;text-decoration:underline}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f7f9fb;font-weight:600;color:#3a4756;position:sticky;top:0;z-index:1}
tr:hover td{background:#fafbfd}
tr.selr td{background:#eef8f6}
tfoot td{font-weight:700;background:#f7f9fb;position:sticky;bottom:0}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.s-pendente{background:var(--warn-bg);color:var(--warn)}
.s-distribuido{background:var(--blue-bg);color:var(--blue)}
.s-gerado{background:var(--violet-bg);color:var(--violet)}
.s-pago{background:var(--ok-bg);color:var(--ok)}
.s-ignorado{background:#eceff3;color:#6b7785}
.t-I{background:#e8efff;color:#1d4ed8}.t-E{background:#f3e8ff;color:#7e22ce}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.alert.w{background:var(--warn-bg);color:#7a3d06;border:1px solid #f4d39d}
.alert.e{background:var(--err-bg);color:#7f1d14;border:1px solid #f3bcb5}
.alert.o{background:var(--ok-bg);color:#0f5b2e;border:1px solid #b6e2c5}
.alert.i{background:var(--blue-bg);color:#1e3a8a;border:1px solid #c3d4fb}
.drop{border:2px dashed #b7c3d0;border-radius:12px;padding:22px;text-align:center;background:#fbfcfd;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-2)}
.muted{color:var(--muted)} .small{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;min-width:150px}
.chip b{display:block}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid #c8d0da;border-radius:20px;padding:5px 12px;background:#fff;cursor:pointer;font:inherit;font-size:13px}
.fchip.on{border-color:#1b2430;background:#1b2430;color:#fff}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.miss{background:#fff4f2 !important}
.actionbar{position:sticky;top:0;z-index:3;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,33,61,.06)}
dialog{border:0;border-radius:14px;padding:0;max-width:680px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
dialog .bd{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
pre.code{background:#0f172a;color:#d6e2f5;padding:12px;border-radius:10px;overflow:auto;font-size:12px;max-height:300px;margin:0}
ol.steps li{margin-bottom:8px}
.toast{position:fixed;right:18px;bottom:18px;background:#14213d;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99;max-width:440px}
.kbd{font-family:Consolas,monospace;background:#eef1f5;border:1px solid #d6dce3;border-radius:5px;padding:0 5px;font-size:12px}
/* charts */
.hbar{display:grid;grid-template-columns:minmax(110px,190px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{position:relative;height:16px;cursor:pointer}
.hbar .tr .bar{position:absolute;left:0;top:2px;height:12px;border-radius:0 4px 4px 0;min-width:2px}
.hbar .tr:hover .bar{filter:brightness(.92)}
.hbar .vl{font-variant-numeric:tabular-nums;color:#334155;text-align:right}
.hbar .dim{opacity:.28}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:#334155;margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-size:11px;fill:#5d6b7c;font-family:inherit}
svg.chart .hit{fill:transparent;cursor:pointer}
svg.chart .hit:hover{fill:rgba(20,33,61,.05)}
#tip{position:fixed;pointer-events:none;background:#14213d;color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;z-index:100;display:none;max-width:280px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.empty{color:var(--muted);text-align:center;padding:26px}
.print-only{display:none}
.app.nologin{grid-template-columns:1fr}
body.nologin{background:radial-gradient(ellipse at 30% 0%,#1e1b4b 0%,#0f1029 55%,#07071a 100%);min-height:100vh}
.login .logo{display:block;width:150px;height:150px;margin:-96px auto 10px;border-radius:30px;box-shadow:0 18px 40px rgba(20,16,70,.45)}
.login{margin-top:14vh}
.login button.p{background:linear-gradient(90deg,#4f46e5,#7c3aed);border-color:#5b4be0}.login button.p:hover{filter:brightness(1.08);background:linear-gradient(90deg,#4f46e5,#7c3aed)}
.login input:focus,.login select:focus{outline-color:#c4b5fd;border-color:#6d5bd0}
.login .firma{text-align:center;font-size:11px;letter-spacing:.32em;color:#8b8fb8;margin:-2px 0 16px}
nav .brandrow{display:flex;align-items:center;gap:10px;padding:0 6px 14px}
nav .brandrow img{width:42px;height:42px;border-radius:11px;flex:none}
nav .brandrow .brand{padding:0}
nav .brandrow .sub{padding:0;margin-top:1px}
nav .credit{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;opacity:.6;padding:14px 8px 0}
nav .credit img{width:18px;height:18px;border-radius:5px}
.topbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:-8px 0 18px;padding-bottom:12px;position:relative}
.topbar::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:1px;background:linear-gradient(90deg,transparent,#a5b4fc,#c4b5fd,transparent)}
.topbar img{width:30px;height:30px;border-radius:8px;box-shadow:0 3px 10px rgba(49,46,129,.25)}
.topbar span{font-size:12px;letter-spacing:.38em;font-weight:600;background:linear-gradient(90deg,#4f46e5,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
body::before{content:"";position:fixed;z-index:0;pointer-events:none;width:min(520px,60vw);aspect-ratio:1;left:calc(232px + (100vw - 232px)/2);top:56%;transform:translate(-50%,-50%);background:var(--wm) center/contain no-repeat;opacity:.06}
body.nologin::before{display:none}
.app{position:relative;z-index:1}
.empty{background:var(--wm) center 6px/64px no-repeat;padding-top:80px !important}
@media (max-width:860px){body::before{left:50%}}
@media print{body::before,.topbar{display:none !important}}
.topbar .sino{position:absolute;right:0;top:-6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer;font:inherit;font-size:14px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.topbar .sino:hover{border-color:#a5b4fc}.topbar .sino b{background:#dc2626;color:#fff;border-radius:10px;padding:0 7px;font-size:12px}.topbar .sino b.lar{background:#f59e0b;color:#1b2430}
dialog.painel{max-width:720px}
.pend{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.pend .ic{font-size:20px;line-height:1.2}.pend .tx{flex:1}.pend .tx b{display:block}.pend .tx .small{color:var(--muted)}
.pend.red{border-left:4px solid #dc2626;border-radius:0 12px 12px 0}.pend.orange{border-left:4px solid #f59e0b;border-radius:0 12px 12px 0}.pend.info{border-left:4px solid #6366f1;border-radius:0 12px 12px 0}
.recado{background:linear-gradient(90deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.recado .meta{font-size:12px;color:#5b5f97;margin-bottom:4px}.recado .txt{white-space:pre-wrap}
.print-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}.print-head img{width:56px;height:56px;border-radius:12px}
.login{max-width:420px;margin:8vh auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(20,33,61,.08)}
.login h1{font-size:22px}.login label.f{margin-bottom:12px}.login input,.login select{font-size:16px;padding:9px 10px}
.pin{letter-spacing:.4em;font-size:20px !important;text-align:center}
.userbox{background:rgba(255,255,255,.08);border-radius:10px;padding:10px;margin:0 0 6px;font-size:13px;color:#fff}
.userbox .pf{font-size:11.5px;opacity:.75}
.userbox button{display:inline-block;width:auto;padding:3px 8px;margin:6px 4px 0 0;font-size:12px;background:rgba(255,255,255,.14);color:#fff;border-radius:6px}
.card.locked{position:relative}
input:disabled,select:disabled,textarea:disabled{background:#f1f4f7;color:#7b8794;cursor:not-allowed}
.card.locked::after{content:attr(data-lockmsg);position:absolute;top:14px;right:16px;font-size:12px;color:#7a3d06;background:var(--warn-bg);border:1px solid #f4d39d;padding:1px 8px;border-radius:10px}
.pf-admin{background:#fde8e8;color:#9b1c1c}.pf-financeiro{background:var(--blue-bg);color:var(--blue)}.pf-consulta{background:#eceff3;color:#475569}
@media (max-width:860px){.app{grid-template-columns:1fr}nav{position:static;height:auto}main{padding:16px}.g2{grid-template-columns:1fr}}
@media print{
  nav,.noprint,.actionbar,.toast{display:none !important}
  .app{display:block} main{padding:0} body{background:#fff}
  .card{border:0;padding:0;margin-bottom:18px;break-inside:avoid}
  .tbl-wrap{max-height:none;overflow:visible;border:0}
  th{position:static} .print-only{display:block}
  .pagebreak{break-before:page}
}
</style>

function cnpjValido(c){ c=digits(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=b=>{let s=0,p=b.length-7;for(let i=0;i<b.length;i++){s+=b[i]*p--; if(p<2)p=9;} const r=s%11; return r<2?0:11-r;};
  const n=c.split('').map(Number); return calc(n.slice(0,12))===n[12] && calc(n.slice(0,13))===n[13]; }
function cpfValido(c){ c=digits(c); if(c.length!==11||/^(\d)\1+$/.test(c)) return false; const n=c.split('').map(Number);
  let s=0; for(let i=0;i<9;i++) s+=n[i]*(10-i); let r=(s*10)%11%10; if(r!==n[9]) return false;
  s=0; for(let i=0;i<10;i++) s+=n[i]*(11-i); r=(s*10)%11%10; return r===n[10]; }
const docValido = d => { d=digits(d); return d.length===14?cnpjValido(d):d.length===11?cpfValido(d):false; };

  m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`; return '';
}

/* ---------------- banco de dados (IndexedDB + arquivo vinculado) ---------------- */
function blankDB(){ return { versao:2, criadoEm:new Date().toISOString(), processos:[], clientes:[], despachantes:JSON.parse(JSON.stringify(DEFAULT_DESP)), lotes:[], importacoes:[], arquivosLidos:[], conciliados:[], usuarios:[], auditoria:[], config:JSON.parse(JSON.stringify(DEFAULT_CONFIG)), ultimoBackup:'' }; }
function fixDB(d){
  const b=blankDB(); d = Object.assign(b, d||{});
  d.config = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), d.config||{});
  if(!Array.isArray(d.config.linhas)) d.config.linhas = DEFAULT_CONFIG.linhas.slice();
  while(d.config.linhas.length<15) d.config.linhas.push('');
  ['processos','clientes','lotes','importacoes','arquivosLidos','conciliados','usuarios','auditoria','recados'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  if(!d.relExportados || typeof d.relExportados!=='object') d.relExportados={};
  if(!d.excluidos || typeof d.excluidos!=='object') d.excluidos={};
  // completa campos de versões anteriores
  d.processos.forEach(p=>{ if(p.status==='gerado' && !p.dataGeracao){ const l=d.lotes.find(x=>x.id===p.loteId); p.dataGeracao = l ? l.data : (p.criado||new Date().toISOString()); p.venc = p.venc || (l&&l.venc) || ''; } });
  return d;
}
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('sda_sistema',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); r.result.createObjectStore('h'); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(store,k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction(store,'readwrite'); t.objectStore(store).put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); }); }
async function idbGet(store,k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction(store).objectStore(store).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbDel(store,k){ try{ const db=await idb(); db.transaction(store,'readwrite').objectStore(store).delete(k); }catch(e){} }

let saveTimer=null, fileTimer=null;
/* ---- controle de versão por registro: cada alteração ganha data (upd); exclusões viram "lápide" ---- */
const SYNC_COLS=['processos','clientes','despachantes','lotes','conciliados'];
let SNAP=null;
const semUpd = x => { const {upd, ...r}=x; return JSON.stringify(r); };
function takeSnapshot(){ SNAP={}; SYNC_COLS.forEach(c=>{ SNAP[c]=new Map(DB[c].map(x=>[x.id, semUpd(x)])); }); SNAP.config=JSON.stringify(DB.config); }
function stampChanges(){
  if(!SNAP){ takeSnapshot(); return; }
  const now=new Date().toISOString(); if(!DB.excluidos) DB.excluidos={};
  SYNC_COLS.forEach(c=>{ const m=SNAP[c]; const vivos=new Set();
    DB[c].forEach(x=>{ if(!x.id) x.id=uid(); vivos.add(x.id); const s=semUpd(x); if(m.get(x.id)!==s){ x.upd=now; m.set(x.id,s); } });
    for(const id of [...m.keys()]) if(!vivos.has(id)){ (DB.excluidos[c]=DB.excluidos[c]||{})[id]=now; m.delete(id); }
  });
  const cs=JSON.stringify(DB.config); if(cs!==SNAP.config){ DB.configUpd=now; SNAP.config=cs; }
}
function save(){
  stampChanges();
  DB.atualizadoEm = new Date().toISOString();
  clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ try{ await idbSet('kv','db', JSON.parse(JSON.stringify(DB))); }catch(e){ try{ localStorage.setItem('sda_sistema_v1', JSON.stringify(DB)); }catch(_){} } }, 150);
  if (state.fileHandle){ clearTimeout(fileTimer); fileTimer=setTimeout(writeLinkedFile, 700); }
}
/* junta duas versões do banco (alterações feitas em computadores diferentes): vale a alteração mais recente de cada registro */
function mergeDB(local, remoto){
  const L=fixDB(local), Rm=fixDB(remoto); const out=L;
  const rank = p => (p.status==='gerado'?4:p.status==='ignorado'?1:p.despId?2:1) + (p.pago?1:0);
  const exc={};
  SYNC_COLS.forEach(c=>{ exc[c]=Object.assign({}, (L.excluidos||{})[c]||{}); for(const [id,t] of Object.entries((Rm.excluidos||{})[c]||{})) if(!exc[c][id] || t>exc[c][id]) exc[c][id]=t; });
  const better=(c,a,b)=>{ const ua=a.upd||'', ub=b.upd||''; if(ua!==ub) return ub>ua?b:a;
    if(c==='processos') return rank(b)>rank(a)?b:a;
    if(c==='clientes') return (!digits(a.doc)&&digits(b.doc))?b:a;
    if(c==='despachantes') return (!digits(a.codSindasp)&&digits(b.codSindasp))?b:a;
    return a; };
  SYNC_COLS.forEach(c=>{ const m=new Map(); L[c].forEach(x=>m.set(x.id,x)); Rm[c].forEach(x=>{ const ex=m.get(x.id); m.set(x.id, ex?better(c,ex,x):x); });
    out[c]=[...m.values()].filter(x=>{ const t=exc[c][x.id]; return !t || (x.upd||'')>t; }); });
  const uniq=(a,b,key)=>{ const m=new Map(); [...a,...b].forEach(x=>{ const k=key(x); if(!m.has(k)) m.set(k,x); }); return [...m.values()]; };
  out.importacoes=uniq(L.importacoes,Rm.importacoes,x=>x.id).sort((a,b)=>b.data.localeCompare(a.data));
  out.arquivosLidos=uniq(L.arquivosLidos,Rm.arquivosLidos,x=>x.chave);
  out.auditoria=uniq(L.auditoria,Rm.auditoria,x=>x.id).sort((a,b)=>b.em.localeCompare(a.em)).slice(0,20000);
  const us=new Map(); [...L.usuarios,...Rm.usuarios].forEach(u=>{ const ex=us.get(u.id); if(!ex || (u.upd||'')>(ex.upd||'')) us.set(u.id,u); }); out.usuarios=[...us.values()];
  // registros antigos (sem data de alteração) que a auditoria mostra como excluídos/desfeitos não voltam
  const exclAud={}; out.auditoria.filter(a=>a.acao==='Exclusão' && a.detalhe.includes(': ')).forEach(a=>a.detalhe.split(': ').slice(1).join(': ').split(', ').forEach(pr=>{ pr=pr.trim(); if(pr && (!exclAud[pr]||a.em>exclAud[pr])) exclAud[pr]=a.em; }));
  out.processos=out.processos.filter(p=>!(!p.upd && exclAud[p.processo] && exclAud[p.processo]>(p.importadoEm||p.criado||'')));
  const lotesDesf=out.auditoria.filter(a=>a.acao==='Lote desfeito').map(a=>a.detalhe);
  out.lotes=out.lotes.filter(l=>l.upd || !lotesDesf.some(d=>d.includes(new Date(l.data).toLocaleString('pt-BR'))));
  // mesmo processo importado em dois computadores (ids diferentes): fica o mais recente
  const pk=new Map(); out.processos.forEach(p=>{ const k=p.processo+'|'+(p.registro||''); const ex=pk.get(k); if(!ex){ pk.set(k,p); return; }
    const up=p.upd||'', ue=ex.upd||''; pk.set(k, up!==ue ? (up>ue?p:ex) : rank(p)!==rank(ex) ? (rank(p)>rank(ex)?p:ex) : (p.id<ex.id?p:ex)); });
  out.processos=[...pk.values()];
  const ck=new Map(); out.clientes.forEach(cl=>{ const k=norm(cl.nome); const ex=ck.get(k); ck.set(k, ex?better('clientes',ex,cl):cl); }); out.clientes=[...ck.values()];
  out.lotes.sort((a,b)=>b.data.localeCompare(a.data));
  out.excluidos=exc;
  const rc=new Map(); [...L.recados,...Rm.recados].forEach(r=>{ const ex=rc.get(r.id); if(!ex){ rc.set(r.id, JSON.parse(JSON.stringify(r))); return; } ex.lidos=Object.assign({}, r.lidos||{}, ex.lidos||{}); ex.arquivado = !!(ex.arquivado||r.arquivado); });
  out.recados=[...rc.values()].sort((a,b)=>b.em.localeCompare(a.em));
  out.relExportados=Object.assign({}, Rm.relExportados||{}, L.relExportados||{});
  if((Rm.configUpd||'')>(L.configUpd||'')){ out.config=fixDB({config:Rm.config}).config; out.configUpd=Rm.configUpd; }
  out.atualizadoEm=new Date().toISOString();
  return out;
}
const assinatura = () => (DB.auditoria[0]||{}).id+'|'+DB.processos.length+'|'+DB.lotes.length+'|'+DB.processos.reduce((m,p)=>(p.upd||'')>m?p.upd:m,'');
async function syncFromFile(){
  if(!state.fileHandle) return false;
  const cur=await state.fileHandle.getFile();
  if(state.fileMtime && cur.lastModified > state.fileMtime + 1000){
    const txt=await cur.text(); state.fileMtime=cur.lastModified;
    if(txt.trim()){ const antes=assinatura(); stampChanges(); DB = mergeDB(DB, JSON.parse(txt)); takeSnapshot();
      try{ await idbSet('kv','db', JSON.parse(JSON.stringify(DB))); }catch(e){}
      if(assinatura()!==antes){ state.ultimaSync=new Date(); toast('🔄 Atualizado com alterações feitas por outro usuário.'); return true; } }
  }
  return false;
}

const COLS = {

}

function validarDesp(d, procs){
  const erros=[], avisos=[];
  if(!digits(d.codSindasp)) erros.push(`Despachante ${esc(d.nome)}: falta o <b>Código SINDASP</b> (ex.: 101). Preencha na aba Despachantes.`);
  if(!cpfValido(d.cpf)) erros.push(`Despachante ${esc(d.nome)}: CPF inválido.`);
  for(const p of procs){
    const c=clienteDe(p);
    if(!c || !digits(c.doc)) erros.push(`${esc(p.processo)} – cliente <b>${esc(p.importador)}</b> sem CNPJ/CPF (aba Clientes).`);
    else if(!docValido(c.doc)) avisos.push(`${esc(p.processo)} – CNPJ/CPF de ${esc(p.importador)} parece inválido (${fmtDoc(c.doc)}).`);
    if(valorSDA(p) < 150) erros.push(`${esc(p.processo)} – valor R$ ${brl(valorSDA(p))} abaixo do mínimo aceito pelo SINDASP (R$ 150,00).`);
    if(!p.registro) erros.push(`${esc(p.processo)} – sem número de registro da ${tipoDecl(p)}.`);
    if(!p.dataReg) avisos.push(`${esc(p.processo)} – sem data de registro.`);
  }
  return {erros, avisos};
}
const xe = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function gerarXML(d, procs, venc){

      `      <IENOME>${xe(String(c.razao||c.nome||p.importador).slice(0,60))}</IENOME>`,`      <IEENDERECO>${xe(String(c.endereco||'').slice(0,60))}</IEENDERECO>`,

      `      <IECEP>${digits(c.cep).slice(0,8)}</IECEP>`,`      <IEESTADO>${xe(String(c.uf||'').toUpperCase().slice(0,2))}</IEESTADO>`,

    linhasGuia(p).forEach((t,i)=>L.push(`      <GUIALINHA${i+1}>${xe(t)}</GUIALINHA${i+1}>`));

async function linkPasta(){
  if(!guard('importar')) return;
  if(!window.showDirectoryPicker){ alert('Use Google Chrome ou Microsoft Edge para vincular a pasta.'); return; }
  try{ const h=await showDirectoryPicker({id:'sdaRelatorios', mode:'read'}); state.pasta=h; state.pastaPend=null; try{ await idbSet('h','pasta',h); }catch(e){} toast('📁 Pasta de relatórios vinculada. Verificando…'); await scanPasta(true); render(); }catch(e){}
}

let scanning=false;
async function scanPasta(manual){
  if(!state.pasta || scanning || !can('importar')) return;
  if(!window.XLSX){ if(manual) alert('A biblioteca de planilhas não carregou. Verifique a internet e recarregue (F5).'); return; }
  scanning=true; const tot={arquivos:0,novos:0,atual:0,dup:0,alertas:0,erros:0}; const padrao=norm(DB.config.padraoArquivo||'');
  try{
    if(state.fileHandle) await syncFromFile();
    const lidos=new Set(DB.arquivosLidos.map(a=>a.chave)); const novos=[];
    for await (const [name, entry] of state.pasta.entries()){
      if(entry.kind!=='file' || !/\.(xlsx|xls|csv)$/i.test(name) || name.startsWith('~$')) continue;
      if(padrao && !norm(name).includes(padrao)) continue;
      const f=await entry.getFile(); const chave=`${name}|${f.size}|${f.lastModified}`; if(lidos.has(chave)) continue;
      novos.push({f, chave});
    }
    novos.sort((a,b)=>a.f.lastModified-b.f.lastModified);
    for(const {f, chave} of novos){
      try{ const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array', cellDates:true}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1, raw:true, defval:''});
        const r=importRows(rows, f.name, {quiet:true});
        if(r){ tot.arquivos++; ['novos','atual','dup','alertas'].forEach(k=>tot[k]+=r[k]); } else tot.erros++;
        DB.arquivosLidos.unshift({chave, nome:f.name, data:new Date().toISOString(), ok:!!r, resumo:r?`${r.novos} novo(s), ${r.atual} atualizado(s), ${r.dup} já com guia`:'formato não reconhecido'});
      }catch(e){ tot.erros++; DB.arquivosLidos.unshift({chave, nome:f.name, data:new Date().toISOString(), ok:false, resumo:'erro: '+e.message}); }
    }
    if(DB.arquivosLidos.length>3000) DB.arquivosLidos.length=3000;
    state.pastaUltima=new Date();
    if(novos.length){ save(); render(); toast(`📧 <b>${tot.arquivos} relatório(s) novo(s) lido(s) da pasta.</b><br>${tot.novos} processo(s) novo(s) para distribuir${tot.atual?`, ${tot.atual} atualizado(s)`:''}${tot.dup?`, ${tot.dup} já com guia`:''}.`+(tot.alertas?`<br>⚠ ${tot.alertas} possível(is) retificação(ões) – veja o Banco de dados.`:'')+(tot.erros?`<br>⚠ ${tot.erros} arquivo(s) não reconhecido(s).`:''), 9000); }
    else { renderNav(); if(manual) toast('Nenhum relatório novo na pasta.'); }
  }catch(e){ if(manual) alert('Não consegui ler a pasta: '+e.message); state.pastaPend=state.pasta; state.pasta=null; renderNav(); }
  scanning=false;
}

/* ---------------- conciliação com extrato bancário ---------------- */
function parseOFX(txt){
  return txt.split(/<STMTTRN>/i).slice(1).map((b,i)=>{ const g=t=>{ const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m?m[1].trim():''; };
    const dt=g('DTPOSTED'); const data=dt?`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`:'';
    const valor=parseNum(g('TRNAMT').replace(/^\+/,'')); const hist=[g('NAME'),g('MEMO')].filter(Boolean).join(' – ');
    return {id:'ofx:'+(g('FITID')||`${data}|${valor}|${hist}|${i}`), data, valor, hist}; }).filter(t=>t.data);
}
function parseExtratoRows(rows){
  let hi=rows.findIndex(r=>r && r.some(c=>/^data/i.test(normH(c))) && r.some(c=>/valor|debito|credito/i.test(normH(c))));
  if(hi<0){ alert('Não reconheci o extrato. A planilha precisa ter colunas Data e Valor (ou Débito/Crédito).'); return []; }
  const H=rows[hi].map(normH); const ix=(...a)=>H.findIndex(h=>a.some(x=>h===x||h.startsWith(x)));
  const iD=ix('data'), iH=ix('historico','descricao','lancamento','detalhe','memo'), iV=ix('valor'), iDb=ix('debito','saida'), iCr=ix('credito','entrada');
  return rows.slice(hi+1).map((r,i)=>{ const data=parseDateAny(r[iD]); if(!data) return null;
    let valor = iV>=0 ? parseNum(r[iV]) : 0;
    if(iDb>=0 && parseNum(r[iDb])) valor = -Math.abs(parseNum(r[iDb])); else if(iCr>=0 && parseNum(r[iCr]) && iV<0) valor = Math.abs(parseNum(r[iCr]));
    const hist=iH>=0?String(r[iH]):''; return {id:`plan:${data}|${valor}|${hist}|${i}`, data, valor, hist}; }).filter(Boolean);
}
function lerExtrato(file){
  if(!guard('pagar')) return;
  if(/\.ofx$/i.test(file.name) || /\.txt$/i.test(file.name)){ const r=new FileReader(); r.onload=()=>conciliar(parseOFX(r.result), file.name); r.readAsText(file,'ISO-8859-1'); }
  else readSheetFile(file, rows=>conciliar(parseExtratoRows(rows), file.name));
}
function conciliar(trans, nome){
  const filtro=norm(DB.config.filtroExtrato||''); const usados=new Set(DB.conciliados.map(c=>c.id));
  const abertas=DB.processos.filter(p=>isGerada(p) && !p.pago); const tomadas=new Set(); const res=[];
  for(const t of trans.filter(t=>t.valor<0).sort((a,b)=>a.data.localeCompare(b.data))){
    const v=round2(Math.abs(t.valor)); const r=Object.assign({}, t, {v, jaUsado:usados.has(t.id), filtroOk:!filtro || norm(t.hist).includes(filtro), match:[], cands:[], tipo:'', ok:false});
    if(!r.jaUsado && r.filtroOk){
      const lote=DB.lotes.find(l=>l.qtd>1 && Math.abs(l.total-v)<0.01 && l.data.slice(0,10)<=t.data && l.procs.every(pid=>{ const p=DB.processos.find(x=>x.id===pid); return p && !p.pago && !tomadas.has(pid); }));
      if(lote){ r.match=lote.procs.slice(); r.tipo='lote'; r.loteId=lote.id; r.ok=true; }
      else {
        const c=abertas.filter(p=>!tomadas.has(p.id) && Math.abs(valorSDA(p)-v)<0.01 && (p.dataGeracao||'').slice(0,10)<=t.data)
          .sort((a,b)=>(b.dataGeracao||'').localeCompare(a.dataGeracao||'')); // a mais recente antes do pagamento
        r.cands=c.map(p=>p.id); if(c.length){ r.match=[c[0].id]; r.tipo=c.length>1?'ambiguo':'unico'; r.ok=true; }
      }
      r.match.forEach(id=>tomadas.add(id));
    }
    res.push(r);
  }
  state.conc={arquivo:nome, itens:res}; state.tab='conciliacao'; render();
}
function concEscolher(i, pid){ const r=state.conc.itens[i]; r.match = pid ? [pid] : []; r.ok=!!pid; render(); }
function concConfirmar(){
  if(!guard('pagar')) return;
  const sel=state.conc.itens.filter(r=>r.ok && r.match.length); if(!sel.length){ alert('Nenhum lançamento marcado.'); return; }
  const usadosAgora=new Set(); let n=0;
  for(const r of sel){
    const ids=r.match.filter(id=>!usadosAgora.has(id)); ids.forEach(id=>{ const p=DB.processos.find(x=>x.id===id); if(p && isGerada(p) && !p.pago){ p.pago=true; p.dataPagamento=r.data; p.conciliadoId=r.id; p.pagoPor=userName(); n++; usadosAgora.add(id); } });
    DB.conciliados.unshift({id:r.id, data:r.data, valor:r.v, hist:r.hist, procs:ids, em:new Date().toISOString(), usuario:userName(), arquivo:state.conc.arquivo});
  }
  log('Conciliação', `${n} guia(s) baixadas pelo extrato ${state.conc.arquivo}`);
  save(); state.conc=null; render(); toast(`✅ ${n} guia(s) baixada(s) como paga(s) pela conciliação.`);
}
function desfazerConc(id){ if(!guard('*')) return; const c=DB.conciliados.find(x=>x.id===id); if(!c || !confirm('Desfazer esta conciliação? As guias voltam para "em aberto".')) return;
  c.procs.forEach(pid=>{ const p=DB.processos.find(x=>x.id===pid); if(p && p.conciliadoId===id){ p.pago=false; p.dataPagamento=''; delete p.conciliadoId; } }); DB.conciliados=DB.conciliados.filter(x=>x.id!==id); log('Conciliação desfeita', `${isoToBR(c.data)} R$ ${brl(c.valor)} ${c.hist}`); save(); render(); }

function tipOn(e, html){ const t=$('#tip'); t.innerHTML=html; t.style.display='block'; const x=Math.min(e.clientX+14, innerWidth-t.offsetWidth-8), y=Math.min(e.clientY+14, innerHeight-t.offsetHeight-8); t.style.left=x+'px'; t.style.top=y+'px'; }
function tipOff(){ $('#tip').style.display='none'; }
document.addEventListener('mousemove', e=>{ const el=e.target.closest && e.target.closest('[data-tip]'); if(el) tipOn(e, el.getAttribute('data-tip')); else tipOff(); });
function hbars(items, opts={}){
  // items: [{label, value, color, tip, click, dim, extra}]
  const max=Math.max(1,...items.map(i=>i.value));
  if(!items.length) return `<div class="empty">Sem dados no período.</div>`;
  return `<div class="hbar">${items.map(i=>`<div class="lb" title="${esc(i.label)}">${i.color&&!opts.noDot?`<span class="dot" style="background:${i.color};margin-right:6px;vertical-align:-1px"></span>`:''}${esc(i.label)}</div>
    <div class="tr ${i.dim?'dim':''}" ${i.click?`onclick="${i.click}"`:''} data-tip="${esc(i.tip||'')}"><div class="bar" style="width:${(i.value/max*100).toFixed(2)}%;background:${i.color||'var(--s1)'}"></div></div>
    <div class="vl">${opts.fmt?opts.fmt(i.value):i.value}${i.extra?` <span class="muted small">${i.extra}</span>`:''}</div>`).join('')}</div>`;
}
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function stackedCols(cats, series, opts={}){
  // cats: [{key,label}], series: [{id,label,color,values:{catKey:number}}]
  const mainW=(document.querySelector('main')||{}).clientWidth||1000; const W=Math.max(420, Math.min(1400, mainW-90)),H=250,pl=56,pr=8,pt=10,pb=26, iw=W-pl-pr, ih=H-pt-pb;
  const tot=cats.map(c=>series.reduce((s,se)=>s+(se.values[c.key]||0),0)); const ymax=niceMax(Math.max(...tot,0));
  const bw=Math.max(4,Math.min(40, iw/cats.length*0.62)), step=iw/cats.length;
  let g=''; for(let i=0;i<=4;i++){ const y=pt+ih-ih*i/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${opts.fmtAxis?opts.fmtAxis(ymax*i/4):brl0(ymax*i/4)}</text>`; }
  const every=Math.ceil(cats.length/16);
  cats.forEach((c,ci)=>{
    const x=pl+step*ci+(step-bw)/2; let y0=pt+ih; const parts=[];
    series.forEach(se=>{ const v=se.values[c.key]||0; if(v<=0) return; const h=v/ymax*ih; parts.push({y:y0-h,h,color:se.color,v,label:se.label}); y0-=h; });
    parts.forEach((pp,k)=>{ const top=k===parts.length-1; const gap=k>0?2:0; const hh=Math.max(0,pp.h-gap);
      if(top && hh>4) g+=`<path d="M${x},${pp.y+hh} v${-(hh-4)} q0,-4 4,-4 h${bw-8} q4,0 4,4 v${hh-4} z" fill="${pp.color}"/>`;
      else g+=`<rect x="${x}" y="${pp.y}" width="${bw}" height="${hh}" fill="${pp.color}"/>`; });
    if(ci%every===0) g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${esc(c.label)}</text>`;
    const tip=`<b>${esc(c.full||c.label)}</b><br>`+series.filter(se=>se.values[c.key]).map(se=>`<span class="dot" style="background:${se.color}"></span> ${esc(se.label)}: ${opts.fmtTip?opts.fmtTip(se.values[c.key]):se.values[c.key]}`).join('<br>')+(series.length>1?`<br><b>Total: ${opts.fmtTip?opts.fmtTip(tot[ci]):tot[ci]}</b>`:'');
    g+=`<rect class="hit" x="${pl+step*ci}" y="${pt}" width="${step}" height="${ih}" data-tip="${esc(tot[ci]?tip:'<b>'+esc(c.full||c.label)+'</b><br>sem guias')}" ${opts.click?`onclick="${opts.click(c.key)}"`:''}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||'gráfico')}">${g}</svg>`;
}

function filtradosDist(){
  const f=state.f, q=norm(f.q);
  return DB.processos.filter(p=>{ const s=statusDe(p);
    if(f.status==='abertos' && !(s==='pendente'||s==='distribuido')) return false;
    if(f.status && f.status!=='abertos' && f.status!=='todos' && s!==f.status) return false;
    if(f.de && p.dataReg && p.dataReg<f.de) return false; if(f.ate && p.dataReg && p.dataReg>f.ate) return false;
    if(f.desp==='__sem' && p.despId) return false; if(f.desp && f.desp!=='__sem' && p.despId!==f.desp) return false;
    if(f.tipo && p.tipo!==f.tipo) return false;
    if(q && !norm([p.processo,p.importador,p.refCliente,p.hawb,p.registro].join(' ')).includes(q)) return false;
    return true;
  }).sort((a,b)=> (b.dataReg||'').localeCompare(a.dataReg||'') || a.processo.localeCompare(b.processo));
}
function filtradosBanco(){
  const f=state.bf, q=norm(f.q);
  return DB.processos.filter(p=>{ const s=statusDe(p);
    if(f.mes){ const d = f.base==='registro' ? p.dataReg : (p.dataGeracao||'').slice(0,10); if(!d || d.slice(0,7)!==f.mes) return false; }
    if(f.status==='geradas' && !isGerada(p)) return false; else if(f.status && f.status!=='geradas' && s!==f.status) return false;
    if(f.desp && p.despId!==f.desp) return false; if(f.tipo && p.tipo!==f.tipo) return false;
    if(f.alerta && !p.alerta) return false;
    if(q && !norm([p.processo,p.importador,p.refCliente,p.hawb,p.registro,(clienteDe(p)||{}).doc].join(' ')).includes(q)) return false;
    return true;
  }).sort((a,b)=> (b.dataGeracao||b.importadoEm||'').localeCompare(a.dataGeracao||a.importadoEm||'') || a.processo.localeCompare(b.processo));
}

/* ===== IMPORTAR E DISTRIBUIR ===== */

  <div class="actionbar"><div class="row">
    <b>${selArr.length} selecionado(s)</b><span class="muted">R$ ${brl(selArr.reduce((s,p)=>s+valorSDA(p),0))}</span><span class="spacer"></span>

/* ===== GERAR ===== */
gerar(){
  const venc=addDaysISO(todayISO(), DB.config.diasVenc), ds=despOrdem().filter(d=>procsParaGerar(d.id).length), pend=DB.processos.filter(p=>statusDe(p)==='pendente').length;

  ${pend?`<div class="alert w">${pend} processo(s) ainda aguardando distribuição. <button class="link" onclick="state.f.status='pendente';go('distribuicao')">Distribuir agora</button></div>`:''}
  <div class="card"><div class="row">
    <label class="f">Vencimento das guias<input type="date" id="venc" value="${venc}"></label>
    <label class="f">Formato<select id="formato"><option value="xml">XML (recomendado)</option><option value="txt">TXT</option><option value="ambos">XML + TXT</option></select></label>
    <span class="spacer"></span><button class="b p" ${ds.length?'':'disabled'} onclick='gerar(${JSON.stringify(ds.map(d=>d.id))}, true)'>📦 Gerar de todos (ZIP)</button>
  </div><p class="muted small" style="margin:8px 0 0">XML: leva código SINDASP e CPF do despachante + dados do cliente. TXT: o cliente precisa já estar cadastrado no login do despachante no SINDASP (use "TXT de clientes" em Clientes).</p></div>
  ${ds.map(d=>{ const procs=procsParaGerar(d.id), v=validarDesp(d,procs), tot=procs.reduce((s,p)=>s+valorSDA(p),0);
    return `<div class="card" style="border-left:4px solid ${despCor(d.id)}"><div class="row"><h2 style="margin:0">${d.codSDA} – ${esc(d.nome)}</h2><span class="muted">SINDASP ${esc(d.codSindasp||'—')} • CPF ${fmtDoc(d.cpf)}</span><span class="spacer"></span><b>${procs.length} guia(s) • R$ ${brl(tot)}</b>
      <button class="b p" ${v.erros.length?'disabled':''} onclick="gerar(['${d.id}'], false)">Gerar arquivo</button></div>
      ${v.erros.length?`<div class="alert e" style="margin-top:10px">${v.erros.join('<br>')}</div>`:''}${v.avisos.length?`<div class="alert w" style="margin-top:10px">${v.avisos.join('<br>')}</div>`:''}
      <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Processo</th><th>Cliente</th><th>CNPJ/CPF</th><th>Registro</th><th>Data reg.</th><th class="r">CIF/FOB</th><th class="r">Valor SDA</th></tr></thead><tbody>
      ${procs.map(p=>{ const c=clienteDe(p); return `<tr><td>${esc(p.processo)}</td><td>${esc(c?.razao||p.importador)}</td><td>${c&&digits(c.doc)?fmtDoc(c.doc):'<span class="badge s-pendente">falta</span>'}</td><td>${esc(p.registro)}</td><td>${isoToBR(p.dataReg)}</td><td class="r">${brl(p.tipo==='E'?p.fob:p.cif)}</td><td class="r"><b>${brl(valorSDA(p))}</b></td></tr>`; }).join('')}
      </tbody></table></div>
      <details style="margin-top:8px"><summary class="small muted" style="cursor:pointer">Ver a descrição da guia (1º processo)</summary><pre class="code" style="margin-top:6px">${esc(linhasGuia(procs[0]).filter(Boolean).join('\n'))}</pre></details></div>`; }).join('') || `<div class="card empty">Nenhum processo distribuído aguardando guia.</div>`}`;
},
/* ===== BANCO DE DADOS ===== */

    <td class="r">${brl(p.tipo==='E'?p.fob:p.cif)}</td><td class="r"><b>${brl(valorSDA(p))}</b></td><td>${p.despId?`<span class="dot" style="background:${despCor(p.despId)};margin-right:5px"></span>`:''}${esc((despById(p.despId)||{}).nome||'—')}</td>
    <td>${isoToBR(p.dataGeracao)}</td><td style="${venc?'color:var(--err);font-weight:600':''}">${isoToBR(p.venc)}${venc?' (vencida)':''}</td>
    <td><span class="badge s-${s}">${STATUS_TXT[s]}${s==='pago'&&p.dataPagamento?' '+isoToBR(p.dataPagamento):''}</span></td></tr>`; }).join('') || tabelaVazia(13,'Nenhum processo com esses filtros.')}
  </tbody></table></div>${lista.length>1500?`<p class="muted small">Mostrando 1.500 de ${lista.length}. Use os filtros ou exporte para Excel.</p>`:''}

    ${DB.importacoes.slice(0,200).map(i=>`<tr><td>${new Date(i.data).toLocaleString('pt-BR')}</td><td>${esc(i.arquivo)}</td><td>${esc(i.origem||'manual')}</td><td class="r">${i.novos}</td><td class="r">${i.atual}</td><td class="r">${i.dup}</td><td>${esc(i.usuario||'')}</td></tr>`).join('') || tabelaVazia(7,'Nenhuma importação.')}</tbody></table></div></details>`;

/* ===== RELATÓRIO MENSAL ===== */
relatorio(){
  const r=state.rel; if(!r.mes) r.mes=thisMonth(); const meses=mesesComDados(r.base);
  const procs = DB.processos.filter(p=>isGerada(p) && dataBase(p,r.base).slice(0,7)===r.mes);
  const ds = despOrdem().filter(d=>procs.some(p=>p.despId===d.id));
  const tot=procs.reduce((s,p)=>s+valorSDA(p),0);
  const bloco = d => { const l=procs.filter(p=>p.despId===d.id).sort((a,b)=>(a.dataGeracao||'').localeCompare(b.dataGeracao||'')||a.processo.localeCompare(b.processo)); const t=l.reduce((s,p)=>s+valorSDA(p),0), pg=l.filter(p=>p.pago).reduce((s,p)=>s+valorSDA(p),0);
    return `<div class="card pagebreak" style="border-left:4px solid ${despCor(d.id)}"><div class="row"><h2 style="margin:0">${d.codSDA} – ${esc(d.nome)}</h2><span class="muted small">CPF ${fmtDoc(d.cpf)} • Reg. ${esc(d.registro)} • SINDASP ${esc(d.codSindasp||'—')}</span><span class="spacer"></span>
      <button class="b noprint" onclick="relExcel(['${d.id}'])">📊 Excel</button></div>
      <div class="kpis" style="margin:12px 0"><div class="kpi"><div class="l">Guias</div><div class="v">${l.length}</div><div class="s">${l.filter(p=>p.tipo!=='E').length} imp. • ${l.filter(p=>p.tipo==='E').length} exp.</div></div>
        <div class="kpi"><div class="l">Valor total</div><div class="v">R$ ${brl(t)}</div></div><div class="kpi"><div class="l">Pago</div><div class="v" style="color:var(--ok)">R$ ${brl(pg)}</div></div><div class="kpi"><div class="l">Em aberto</div><div class="v" style="color:var(--violet)">R$ ${brl(t-pg)}</div></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Gerada em</th><th>Processo</th><th>Tipo</th><th>Cliente</th><th>CNPJ/CPF</th><th>Ref. Cliente</th><th>Registro</th><th>Data reg.</th><th class="r">CIF/FOB</th><th class="r">Valor SDA</th><th>Situação</th></tr></thead><tbody>
      ${l.map(p=>{ const c=clienteDe(p)||{}; return `<tr><td>${isoToBR(p.dataGeracao)}</td><td>${esc(p.processo)}</td><td>${p.tipo==='E'?'EXP':'IMP'}</td><td>${esc(c.razao||p.importador)}</td><td>${fmtDoc(c.doc)}</td><td>${esc(p.refCliente)}</td><td>${esc(p.registro)}</td><td>${isoToBR(p.dataReg)}</td><td class="r">${brl(p.tipo==='E'?p.fob:p.cif)}</td><td class="r">${brl(valorSDA(p))}</td><td>${p.pago?'Paga '+isoToBR(p.dataPagamento):'Em aberto'}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><td colspan="9">Total ${esc(d.nome)} – ${l.length} guia(s)</td><td class="r">${brl(t)}</td><td></td></tr></tfoot></table></div></div>`; };
  return `<div class="row noprint"><div><h1>Relatório mensal por despachante</h1><p class="lead" style="margin:0">Guias geradas no mês, separadas por despachante. Exporte para Excel ou imprima/salve em PDF.</p></div></div>
  <div class="card noprint" style="margin-top:14px"><div class="row">
    <label class="f">Mês<select onchange="state.rel.mes=this.value;render()">${meses.map(m=>`<option value="${m}" ${r.mes===m?'selected':''}>${mesNome(m)}</option>`).join('')}</select></label>
    <label class="f">Considerar<select onchange="state.rel.base=this.value;render()"><option value="geracao" ${r.base==='geracao'?'selected':''}>Data de geração da guia</option><option value="registro" ${r.base==='registro'?'selected':''}>Data de registro DUIMP/DUE</option></select></label>
    <span class="spacer"></span><button class="b p" ${procs.length?'':'disabled'} onclick="relExcel(null)">📊 Excel (uma aba por despachante)</button><button class="b" ${procs.length?'':'disabled'} onclick="DB.relExportados[state.rel.mes]=new Date().toISOString();log('Relatório mensal','Imprimiu/PDF de '+mesNome(state.rel.mes));save();window.print()">🖨️ Imprimir / PDF</button></div></div>
  <div class="print-only"><div class="print-head"><img src="${LOGO_ICON}" alt=""><div><div style="font-size:11px;letter-spacing:.3em;color:#555">JL SISTEMAS</div><h1 style="margin:0">Relatório mensal SDA – ${mesNome(r.mes)}</h1></div></div><p class="muted">Emitido em ${new Date().toLocaleString('pt-BR')}${' por '+esc(userName())}</p></div>
  <div class="card"><h2>Resumo – ${mesNome(r.mes)}</h2><div class="tbl-wrap"><table><thead><tr><th>Despachante</th><th class="r">Guias</th><th class="r">Importação</th><th class="r">Exportação</th><th class="r">Valor total</th><th class="r">Pago</th><th class="r">Em aberto</th></tr></thead><tbody>
   ${ds.map(d=>{ const l=procs.filter(p=>p.despId===d.id), t=l.reduce((s,p)=>s+valorSDA(p),0), pg=l.filter(p=>p.pago).reduce((s,p)=>s+valorSDA(p),0); return `<tr><td><span class="dot" style="background:${despCor(d.id)};margin-right:6px"></span>${d.codSDA} – ${esc(d.nome)}</td><td class="r">${l.length}</td><td class="r">${l.filter(p=>p.tipo!=='E').length}</td><td class="r">${l.filter(p=>p.tipo==='E').length}</td><td class="r"><b>${brl(t)}</b></td><td class="r">${brl(pg)}</td><td class="r">${brl(t-pg)}</td></tr>`; }).join('') || tabelaVazia(7,'Nenhuma guia gerada neste mês.')}
   </tbody>${procs.length?`<tfoot><tr><td>Total</td><td class="r">${procs.length}</td><td class="r">${procs.filter(p=>p.tipo!=='E').length}</td><td class="r">${procs.filter(p=>p.tipo==='E').length}</td><td class="r">${brl(tot)}</td><td class="r">${brl(procs.filter(p=>p.pago).reduce((s,p)=>s+valorSDA(p),0))}</td><td class="r">${brl(procs.filter(p=>!p.pago).reduce((s,p)=>s+valorSDA(p),0))}</td></tr></tfoot>`:''}</table></div></div>
  ${ds.map(bloco).join('')}`;
},
/* ===== CONCILIAÇÃO ===== */
conciliacao(){
  const c=state.conc; const abertas=DB.processos.filter(p=>isGerada(p)&&!p.pago);
  const nOk = c ? c.itens.filter(r=>r.ok&&r.match.length).length : 0;
  const pLabel = id => { const p=DB.processos.find(x=>x.id===id); return p ? `${p.processo} • ${(clienteDe(p)||{}).razao||p.importador} • gerada ${isoToBR(p.dataGeracao)} • ${despById(p.despId)?.nome||''}` : ''; };
  return `<h1>Conciliação bancária</h1><p class="lead">Importe o extrato do banco e o sistema encontra os pagamentos das guias pelo valor e pela data, para dar baixa automática.</p>
  <div class="card"><div class="row">
    <button class="b p" onclick="$('#fileExtrato').click()">🏦 Importar extrato (OFX, CSV ou Excel)</button>
    <label class="f" style="min-width:260px">Só considerar lançamentos cujo histórico contenha<input value="${esc(DB.config.filtroExtrato)}" placeholder="ex.: SINDASP ou SINDICATO (vazio = todos)" onchange="setCfg('filtroExtrato',this.value)"></label>
    <span class="spacer"></span><span class="muted small">${abertas.length} guia(s) em aberto • R$ ${brl(abertas.reduce((s,p)=>s+valorSDA(p),0))}</span></div>
    <p class="muted small" style="margin:8px 0 0">No internet banking, exporte o extrato em <b>OFX</b> (Money/Quicken) – é o formato mais confiável. O sistema usa só os débitos. Se um débito tiver o mesmo valor do lote inteiro de um despachante, baixa o lote todo; senão, procura uma guia do mesmo valor gerada até a data do pagamento. Valores repetidos (723,00 / 912,00) aparecem como <b>"confira"</b> – escolha a guia certa na lista.</p></div>
  ${c?`<div class="actionbar"><div class="row"><b>${esc(c.arquivo)}</b><span class="muted">${c.itens.length} débito(s) • ${nOk} marcado(s) para baixa</span><span class="spacer"></span><button class="b" onclick="state.conc=null;render()">Cancelar</button><button class="b p" ${nOk?'':'disabled'} onclick="concConfirmar()">✔ Confirmar baixa dos marcados</button></div></div>
  <div class="tbl-wrap"><table><thead><tr><th></th><th>Data</th><th>Histórico</th><th class="r">Valor</th><th>Guia(s) encontrada(s)</th><th>Situação</th></tr></thead><tbody>
  ${c.itens.map((r,i)=>{ const st = r.jaUsado?'<span class="badge s-ignorado">já conciliado</span>' : !r.filtroOk?'<span class="badge s-ignorado">fora do filtro</span>' : r.tipo==='lote'?'<span class="badge s-pago">lote inteiro</span>' : r.tipo==='unico'?'<span class="badge s-pago">encontrada</span>' : r.tipo==='ambiguo'?'<span class="badge s-pendente">confira</span>' : '<span class="badge s-ignorado">sem guia</span>';
    const sel = r.tipo==='lote' ? `${r.match.length} guias do lote de ${esc(despNome(DB.lotes.find(l=>l.id===r.loteId)?.despId))}` : r.cands.length ? `<select class="sm" style="max-width:520px" onchange="concEscolher(${i},this.value)"><option value="">— não baixar —</option>${r.cands.map(id=>`<option value="${id}" ${r.match[0]===id?'selected':''}>${esc(pLabel(id))}</option>`).join('')}</select>` : '';
    return `<tr class="${r.ok?'selr':''}"><td>${(r.match.length&&!r.jaUsado)?`<input type="checkbox" ${r.ok?'checked':''} onchange="state.conc.itens[${i}].ok=this.checked;render()">`:''}</td><td>${isoToBR(r.data)}</td><td style="white-space:normal;max-width:320px">${esc(r.hist)}</td><td class="r"><b>${brl(r.v)}</b></td><td>${sel}</td><td>${st}</td></tr>`; }).join('') || tabelaVazia(6,'Nenhum débito no extrato.')}
  </tbody></table></div>`:''}
  <details class="card" style="margin-top:16px" ${c?'':'open'}><summary style="cursor:pointer;font-weight:600">Baixas já feitas por conciliação (${DB.conciliados.length})</summary>
   <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Data pgto.</th><th>Histórico</th><th class="r">Valor</th><th>Guias</th><th>Extrato</th><th>Feito em</th><th></th></tr></thead><tbody>
   ${DB.conciliados.slice(0,300).map(x=>`<tr><td>${isoToBR(x.data)}</td><td style="white-space:normal;max-width:280px">${esc(x.hist)}</td><td class="r">${brl(x.valor)}</td><td class="small" style="white-space:normal;max-width:240px">${x.procs.map(id=>esc(DB.processos.find(p=>p.id===id)?.processo||'')).join(', ')}</td><td class="small">${esc(x.arquivo||'')}</td><td class="small">${new Date(x.em).toLocaleString('pt-BR')} ${esc(x.usuario||'')}</td><td><button class="b d" data-perm="*" onclick="desfazerConc('${x.id}')">Desfazer</button></td></tr>`).join('') || tabelaVazia(7,'Nenhuma conciliação ainda.')}
   </tbody></table></div></details>`;
},
/* ===== USUÁRIOS ===== */
usuarios(){
  const lista=DB.usuarios.slice().sort((a,b)=>(b.ativo-a.ativo)||a.nome.localeCompare(b.nome));
  return `<h1>Usuários e perfis</h1><p class="lead">Cada pessoa entra com o próprio PIN. Tudo o que ela faz fica registrado na Auditoria.</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:16px">${Object.entries(PERFIS).map(([k,p])=>`<div class="kpi"><span class="badge pf-${k}">${p.nome}</span><div class="small" style="margin-top:6px">${p.desc}</div></div>`).join('')}</div>
  <div class="card"><h2>Novo usuário</h2><div class="row">
    <label class="f">Nome<input id="nuNome" style="min-width:220px"></label>
    <label class="f">Perfil<select id="nuPerfil">${Object.entries(PERFIS).map(([k,p])=>`<option value="${k}" ${k==='financeiro'?'selected':''}>${p.nome}</option>`).join('')}</select></label>
    <label class="f">PIN inicial (4 a 8 números)<input id="nuPin" type="password" inputmode="numeric" maxlength="8" class="pin" style="width:160px"></label>
    <button class="b p" style="align-self:flex-end" onclick="novoUsuario()">➕ Criar</button></div>
    <p class="muted small" style="margin:8px 0 0">Passe o PIN inicial para a pessoa; ela pode trocar em "Trocar PIN".</p></div>
  <div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>Perfil</th><th>Ativo</th><th>Último acesso</th><th class="r">Ações registradas</th><th></th></tr></thead><tbody>
  ${lista.map(u=>`<tr style="${u.ativo?'':'opacity:.55'}"><td><input class="sm" value="${esc(u.nome)}" onchange="setU('${u.id}','nome',this.value)" style="width:200px"> ${u.id===state.user.id?'<span class="muted small">(você)</span>':''}</td>
    <td><select class="sm" onchange="setU('${u.id}','perfil',this.value)">${Object.entries(PERFIS).map(([k,p])=>`<option value="${k}" ${u.perfil===k?'selected':''}>${p.nome}</option>`).join('')}</select></td>
    <td><input type="checkbox" ${u.ativo?'checked':''} onchange="setU('${u.id}','ativo',this.checked)"></td>
    <td>${u.ultimoAcesso?new Date(u.ultimoAcesso).toLocaleString('pt-BR'):'nunca'}</td><td class="r">${DB.auditoria.filter(a=>a.uid===u.id).length}</td>
    <td><div class="row"><button class="b" onclick="resetPinU('${u.id}')">Redefinir PIN</button>${u.perfil==='admin'?`<button class="b" onclick="novoCodigoRec('${u.id}')">Novo código de recuperação</button>`:''}<button class="b d" onclick="delU('${u.id}')">✕</button>
    <button class="b" onclick="state.af={u:'${u.id}',a:'',q:'',de:'',ate:''};go('auditoria')">📜 Ver ações</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
},
/* ===== RECADOS ===== */
recados(){
  const opts=`<option value="todos">Todos os usuários</option>${Object.entries(PERFIS).map(([k,p])=>`<option value="${k}">Perfil ${p.nome}</option>`).join('')}${DB.usuarios.filter(u=>u.ativo&&u.id!==state.user.id).map(u=>`<option value="${u.id}">Só ${esc(u.nome)}</option>`).join('')}`;
  return `<h1>Recados para a equipe</h1><p class="lead">O recado aparece no painel de avisos de cada destinatário ao entrar no sistema, até ele clicar em <b>"Li"</b>. Você acompanha aqui quem já leu.</p>
  <div class="card"><h2>Novo recado</h2><textarea id="rcTexto" rows="3" style="width:100%" placeholder="Ex.: Amanhã o SINDASP fica fora do ar à tarde – gerem as guias até 12h."></textarea>
   <div class="row" style="margin-top:8px"><label class="f">Para<select id="rcDest">${opts}</select></label><label class="f">Mostrar até (opcional)<input type="date" id="rcAte"></label><span class="spacer"></span><button class="b p" style="align-self:flex-end" onclick="novoRecado()">📣 Publicar recado</button></div></div>
  ${DB.recados.map(r=>{ const ds=destinatarios(r); const leram=ds.filter(u=>(r.lidos||{})[u.id]); const venc=r.ate && r.ate<todayISO();
    return `<div class="card" style="${r.arquivado||venc?'opacity:.6':''}"><div class="row"><span class="badge pf-financeiro">Para: ${esc(destinoTxt(r.destino))}</span><span class="muted small">${esc(r.autor)} • ${new Date(r.em).toLocaleString('pt-BR')}${r.ate?` • até ${isoToBR(r.ate)}`:''}${r.arquivado?' • arquivado':venc?' • expirado':''}</span><span class="spacer"></span><button class="b" onclick="arquivarRecado('${r.id}')">${r.arquivado?'Reativar':'Arquivar'}</button></div>
     <div style="white-space:pre-wrap;margin:10px 0">${esc(r.texto)}</div>
     <div class="small"><b>Leitura: ${leram.length}/${ds.length}</b> ${ds.map(u=>(r.lidos||{})[u.id]?`<span class="badge s-pago" title="${new Date(r.lidos[u.id]).toLocaleString('pt-BR')}">✔ ${esc(u.nome)}</span>`:`<span class="badge s-ignorado">${esc(u.nome)}</span>`).join(' ')}</div></div>`; }).join('') || '<div class="card empty">Nenhum recado publicado.</div>'}`;
},
/* ===== AUDITORIA ===== */
auditoria(){
  const f=state.af||(state.af={u:'',a:'',q:'',de:'',ate:''}); const q=norm(f.q);
  const acoes=[...new Set(DB.auditoria.map(a=>a.acao))].sort();
  const lista=DB.auditoria.filter(a=>(!f.u||a.uid===f.u)&&(!f.a||a.acao===f.a)&&(!f.de||a.em.slice(0,10)>=f.de)&&(!f.ate||a.em.slice(0,10)<=f.ate)&&(!q||norm(a.nome+' '+a.acao+' '+a.detalhe).includes(q)));
  return `<h1>Auditoria</h1><p class="lead">Registro de quem fez o quê e quando. Não pode ser editado pela tela.</p>
  <div class="card"><div class="row">
    <label class="f">Usuário<select onchange="state.af.u=this.value;render()"><option value="">Todos</option>${DB.usuarios.map(u=>`<option value="${u.id}" ${f.u===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></label>
    <label class="f">Ação<select onchange="state.af.a=this.value;render()"><option value="">Todas</option>${acoes.map(a=>`<option ${f.a===a?'selected':''}>${esc(a)}</option>`).join('')}</select></label>
    <label class="f">De<input type="date" value="${f.de}" onchange="state.af.de=this.value;render()"></label><label class="f">Até<input type="date" value="${f.ate}" onchange="state.af.ate=this.value;render()"></label>
    <label class="f" style="flex:1;min-width:180px">Buscar (ex.: nº do processo)<input id="aq" value="${esc(f.q)}" oninput="debRender('aq',v=>state.af.q=v,this.value)"></label>
    <button class="b" style="align-self:flex-end" onclick="auditExcel()">📊 Exportar Excel</button></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>Data/hora</th><th>Usuário</th><th>Perfil</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>
  ${lista.slice(0,1000).map(a=>`<tr><td>${new Date(a.em).toLocaleString('pt-BR')}</td><td><b>${esc(a.nome)}</b></td><td>${a.perfil?`<span class="badge pf-${a.perfil}">${PERFIS[a.perfil]?.nome||a.perfil}</span>`:''}</td><td>${esc(a.acao)}</td><td style="white-space:normal;min-width:320px">${esc(a.detalhe)}</td></tr>`).join('') || tabelaVazia(5,'Nenhum registro.')}
  </tbody></table></div>${lista.length>1000?`<p class="muted small">Mostrando 1.000 de ${lista.length}. Use os filtros ou exporte.</p>`:''}`;
},
/* ===== LOTES ===== */
lotes(){
  return `<h1>Lotes gerados</h1><p class="lead">Cada arquivo gerado fica guardado: baixe de novo, exporte ou desfaça.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Gerado em</th><th>Despachante</th><th>Formato</th><th>Vencimento</th><th class="r">Guias</th><th class="r">Total (R$)</th><th>Processos</th><th>Usuário</th><th></th></tr></thead><tbody>
  ${DB.lotes.map(l=>`<tr><td>${new Date(l.data).toLocaleString('pt-BR')}</td><td><span class="dot" style="background:${despCor(l.despId)};margin-right:6px"></span>${esc(despNome(l.despId))}</td><td>${l.formato.toUpperCase()}</td><td>${isoToBR(l.venc)}</td><td class="r">${l.qtd}</td><td class="r"><b>${brl(l.total)}</b></td>
    <td class="small" style="white-space:normal;max-width:300px">${l.resumo.map(r=>esc(r.processo)).join(', ')}</td><td>${esc(l.usuario||'')}</td>
    <td><div class="row"><button class="b" onclick="baixarLote('${l.id}')">⬇ Arquivo</button><button class="b" onclick="relLote('${l.id}')">📊 Excel</button><button class="b d" data-perm="*" onclick="desfazerLote('${l.id}')">Desfazer</button></div></td></tr>`).join('') || tabelaVazia(9,'Nenhum lote gerado ainda.')}
  </tbody></table></div>`;
},
/* ===== CLIENTES ===== */
clientes(){
  const q=norm(state.cq); const lista=DB.clientes.filter(c=>!q||norm(c.nome+' '+c.razao+' '+c.doc).includes(q)).sort((a,b)=> (!!digits(a.doc))-(!!digits(b.doc)) || a.nome.localeCompare(b.nome));
  return `<h1>Clientes (Importador / Exportador)</h1><p class="lead">O relatório traz só o nome. Cadastre CNPJ e endereço uma vez – o sistema reconhece o cliente pelo <b>nome exatamente como vem no relatório</b>.</p>
  <div class="card"><div class="row"><input placeholder="Buscar cliente…" value="${esc(state.cq)}" id="cq" oninput="debRender('cq',v=>state.cq=v,this.value)" style="min-width:240px">
    <button class="b" onclick="novoCliente()">➕ Novo</button><button class="b" onclick="$('#fileCli').click()">📥 Importar planilha</button><button class="b" onclick="exportarClientes()">📊 Exportar / modelo</button><span class="spacer"></span><button class="b" onclick="gerarTxtClientes()" title="Para Menu Cliente ▸ Importação de Cliente no SINDASP">TXT de clientes (SINDASP)</button></div>
  <p class="muted small" style="margin:8px 0 0"><b>Despachante preferencial</b>: a distribuição automática manda sempre os processos desse cliente para esse despachante.</p></div>
  <div class="tbl-wrap"><table><thead><tr><th>Nome no relatório</th><th>Razão social (vai na guia)</th><th>CNPJ / CPF</th><th>Endereço</th><th>Bairro</th><th>Cidade</th><th>UF</th><th>CEP</th><th>Desp. preferencial</th><th class="r">Guias</th><th></th></tr></thead><tbody>
  ${lista.map(c=>{ const ok=digits(c.doc), val=ok&&docValido(c.doc), ng=DB.processos.filter(p=>isGerada(p)&&norm(p.importador)===norm(c.nome)).length; return `<tr class="${ok?'':'miss'}">
    <td><input class="sm" value="${esc(c.nome)}" onchange="setC('${c.id}','nome',this.value)" style="width:190px"></td>
    <td><input class="sm" value="${esc(c.razao)}" onchange="setC('${c.id}','razao',this.value)" style="width:260px" maxlength="60"></td>

  return `<h1>Como usar</h1>

  <div class="card"><h2>🔐 Login e perfis</h2><ul class="small"><li><b>Administrador</b>: tudo – regras de cálculo, despachantes, usuários, configurações, desfazer lotes, pagamentos e conciliações.</li><li><b>Financeiro</b>: importar, distribuir, gerar guias, dar baixa de pagamento, conciliação e clientes.</li><li><b>Consulta</b>: só visualiza dashboard, banco de dados, relatório mensal e lotes.</li></ul>
   <p class="small">O sistema bloqueia sozinho após o tempo sem uso definido em Configurações. Toda ação fica na <b>Auditoria</b> e na ficha do processo. Importante: o PIN organiza o trabalho e registra quem fez o quê; quem protege os dados contra pessoas de fora é a permissão da pasta no Dropbox.</p></div>
  <div class="card"><h2>🔔 Avisos e recados</h2><p class="small">Ao entrar, aparece o <b>Resumo do dia</b> com o que precisa de atenção: guias vencidas ou vencendo, processos parados, distribuídos sem guia, clientes sem CNPJ, possíveis retificações, relatório do dia não importado, banco desconectado e recados do administrador. Cada item tem um botão que leva à tela certa. "Lembrar mais tarde" fecha até o próximo acesso, e o 🔔 no topo abre o painel a qualquer momento. O administrador publica recados em <b>Recados</b> e acompanha quem leu.</p></div>
  <div class="card" id="ajudaEmail"><h2>📧 Leitura automática do relatório que chega por e-mail</h2>
   <p class="small">A ideia: o e-mail chega ▸ o anexo é salvo sozinho numa pasta do Dropbox ▸ o sistema vê o arquivo novo e importa. Você só abre o sistema e distribui.</p>
   <h3>Passo 1 – Criar a pasta</h3><p class="small">Dentro da pasta do sistema no Dropbox (<span class="kbd">Dropbox\\Financeiro\\SDA - Sistema Emissão de Guia</span>) já existe a pasta <span class="kbd">Relatorios</span>. É nela que os anexos vão cair.</p>

   <ol class="steps small"><li>Acesse <b>make.powerautomate.com</b> com o mesmo login do e-mail ▸ <b>Criar ▸ Fluxo da nuvem automatizado</b>.</li>

    <li><b>+ Nova etapa ▸ "Aplicar a cada"</b> ▸ selecione <b>Anexos</b>.</li>
    <li>Dentro dele: <b>Condição</b> – <i>Nome dos anexos</i> <b>contém</b> <span class="kbd">DMDRegistrados</span>.</li>
    <li>No "Sim": ação <b>"Criar arquivo"</b> do conector <b>Dropbox</b> (entre com a conta Dropbox da empresa). Caminho da pasta: use o ícone de pasta para navegar até <span class="kbd">Financeiro/SDA - Sistema Emissão de Guia/Relatorios</span> • Nome do arquivo: <i>Nome dos anexos</i> • Conteúdo: <i>Conteúdo dos anexos</i>.</li>
    <li>Salve e teste reenviando um relatório para você mesmo.</li></ol>
   <p class="small"><b>Opção B – Macro no Outlook clássico (desktop)</b> – o Outlook precisa estar aberto:</p>
   <ol class="steps small"><li>No Outlook: <b>Arquivo ▸ Opções ▸ Central de Confiabilidade ▸ Configurações ▸ Configurações de Macro</b> ▸ "Notificações para todas as macros". Reinicie o Outlook.</li>
    <li>Pressione <span class="kbd">Alt</span>+<span class="kbd">F11</span>. À esquerda, abra <b>Projeto1 ▸ Microsoft Outlook Objetos ▸ EstaSessãoDoOutlook</b> (ThisOutlookSession).</li>
    <li>Abra o arquivo <span class="kbd">Automacao\\Macro_Outlook_SalvarRelatorioSDA.txt</span> da pasta do sistema, copie tudo e cole nessa janela. Salve (<span class="kbd">Ctrl</span>+<span class="kbd">S</span>) e feche o editor.</li>
    <li>Feche e abra o Outlook e clique em <b>Habilitar macros</b> se perguntar. A partir daí, todo e-mail com anexo "DMDRegistrados…" é salvo na pasta Relatorios.</li>
    <li>Para relatórios que já estão na caixa: selecione os e-mails ▸ <span class="kbd">Alt</span>+<span class="kbd">F8</span> ▸ <b>SalvarRelatoriosSelecionados</b> ▸ Executar.</li></ol>
   <p class="small muted">Se você tem uma regra que move o relatório para outra pasta do Outlook, a Opção B precisa olhar essa pasta – a macro explica onde trocar.</p>
   <h3>Passo 3 – Ligar no sistema</h3><ol class="steps small"><li><b>Configurações ▸ Leitura automática ▸ Escolher pasta de relatórios</b> ▸ selecione a pasta <span class="kbd">Relatorios</span> ▸ Permitir.</li>
    <li>Pronto: com o sistema aberto, a pasta é conferida a cada 2 minutos e ao voltar para a aba. Cada arquivo é lido uma única vez. Ao abrir o navegador de novo, clique em <b>Reativar leitura automática</b> (o navegador exige um clique por segurança).</li></ol></div>

}

function auditExcel(){ if(!window.XLSX) return; const f=state.af||{}; const q=norm(f.q||''); const rows=DB.auditoria.filter(a=>(!f.u||a.uid===f.u)&&(!f.a||a.acao===f.a)&&(!f.de||a.em.slice(0,10)>=f.de)&&(!f.ate||a.em.slice(0,10)<=f.ate)&&(!q||norm(a.nome+' '+a.acao+' '+a.detalhe).includes(q))).map(a=>({'Data/hora':new Date(a.em).toLocaleString('pt-BR'),'Usuário':a.nome,'Perfil':PERFIS[a.perfil]?.nome||'','Ação':a.acao,'Detalhe':a.detalhe}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, sheet(rows,[{wch:19},{wch:22},{wch:14},{wch:22},{wch:100}]), 'Auditoria'); XLSX.writeFile(wb,`Auditoria_SDA_${nowStamp()}.xlsx`); }
function togDash(id){ const s=state.dash.desp; s.has(id)?s.delete(id):s.add(id); render(); }

function debRender(elId, setter, v){ setter(v); clearTimeout(window._deb); window._deb=setTimeout(()=>{ render(); const e=document.getElementById(elId); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } },300); }
function relExcel(ids){
  if(!window.XLSX){ alert('Biblioteca de planilhas não carregou.'); return; }
  const r=state.rel; DB.relExportados[r.mes]=new Date().toISOString(); log('Relatório mensal', `Exportou Excel de ${mesNome(r.mes)}`); save(); const procs=DB.processos.filter(p=>isGerada(p) && dataBase(p,r.base).slice(0,7)===r.mes);
  const ds=despOrdem().filter(d=>procs.some(p=>p.despId===d.id) && (!ids || ids.includes(d.id)));
  const wb=XLSX.utils.book_new();
  const resumo=ds.map(d=>{ const l=procs.filter(p=>p.despId===d.id), t=l.reduce((s,p)=>s+valorSDA(p),0), pg=l.filter(p=>p.pago).reduce((s,p)=>s+valorSDA(p),0);
    return {'Cód. SDA':d.codSDA,'Despachante':d.nome,'CPF':fmtDoc(d.cpf),'Guias':l.length,'Importação':l.filter(p=>p.tipo!=='E').length,'Exportação':l.filter(p=>p.tipo==='E').length,'Valor total (R$)':round2(t),'Pago (R$)':round2(pg),'Em aberto (R$)':round2(t-pg)}; });
  resumo.push({'Cód. SDA':'','Despachante':'TOTAL','CPF':'','Guias':resumo.reduce((s,x)=>s+x.Guias,0),'Importação':resumo.reduce((s,x)=>s+x['Importação'],0),'Exportação':resumo.reduce((s,x)=>s+x['Exportação'],0),'Valor total (R$)':round2(resumo.reduce((s,x)=>s+x['Valor total (R$)'],0)),'Pago (R$)':round2(resumo.reduce((s,x)=>s+x['Pago (R$)'],0)),'Em aberto (R$)':round2(resumo.reduce((s,x)=>s+x['Em aberto (R$)'],0))});
  XLSX.utils.book_append_sheet(wb, sheet(resumo,[{wch:9},{wch:26},{wch:16},{wch:8},{wch:11},{wch:11},{wch:16},{wch:14},{wch:15}]), 'Resumo');
  ds.forEach(d=>{ const l=procs.filter(p=>p.despId===d.id).sort((a,b)=>(a.dataGeracao||'').localeCompare(b.dataGeracao||'')); const rows=l.map(linhaExcel); rows.push({'Despachante':'TOTAL','Valor SDA (R$)':round2(l.reduce((s,p)=>s+valorSDA(p),0))});
    XLSX.utils.book_append_sheet(wb, sheet(rows), `${d.codSDA}-${norm(d.nome).split(' ')[0]}`.slice(0,31)); });
  XLSX.writeFile(wb, `Relatorio_SDA_${r.mes}${ids&&ds[0]?'_'+norm(ds[0].nome).split(' ')[0]:''}.xlsx`);
}
function afterRender(){
  document.querySelectorAll('#main [data-perm]').forEach(el=>{ const pm=el.dataset.perm; if(can(pm)) return;
    const alvo = el.matches('button,input,select,textarea') ? [el] : el.querySelectorAll('button,input,select,textarea');
    alvo.forEach(t=>{ t.disabled=true; t.title='🔒 '+(PERM_TXT[pm]||'Sem permissão'); });
    if(!el.matches('button,input,select,textarea')){ el.classList.add('locked'); if(!el.dataset.lockmsg) el.dataset.lockmsg='🔒 '+(PERM_TXT[pm]||'Sem permissão'); } });
  const d=$('#drop'); if(d){ d.ondragover=e=>{e.preventDefault(); d.classList.add('over');}; d.ondragleave=()=>d.classList.remove('over'); d.ondrop=e=>{e.preventDefault(); d.classList.remove('over'); const f=e.dataTransfer.files[0]; if(f) readSheetFile(f, importRows);}; }
}
$('#fileXlsx').onchange = e => { const f=e.target.files[0]; if(f) readSheetFile(f, importRows); e.target.value=''; };
$('#fileCli').onchange = e => { const f=e.target.files[0]; if(f) readSheetFile(f, importarClientes); e.target.value=''; };
$('#fileExtrato').onchange = e => { const f=e.target.files[0]; if(f) lerExtrato(f); e.target.value=''; };
$('#fileBackup').onchange = e => { const f=e.target.files[0]; if(f) importBackup(f); e.target.value=''; };
window.addEventListener('resize', ()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>{ if(state.tab==='dashboard') render(); },250); });
window.addEventListener('beforeunload', ()=>{ try{ localStorage.setItem('sda_sistema_v1', JSON.stringify(DB)); }catch(e){} });

document.documentElement.style.setProperty('--wm', `url("${LOGO_WM}")`);
(async function init(){
  await loadDB();
  const h = await idbGet('h','dados');
  if (h){ try{ if (await h.queryPermission({mode:'readwrite'})==='granted'){ const fl=await h.getFile(); const t=await fl.text(); if(t.trim()){ DB=mergeDB(DB, JSON.parse(t)); takeSnapshot(); } state.fileHandle=h; state.fileMtime=fl.lastModified; state.fileStatus='conectado'; } else state.pendingHandle=h; }catch(e){ state.pendingHandle=h; } }
  const sid=sessionStorage.getItem('sda_uid'); if(sid){ const u=DB.usuarios.find(x=>x.id===sid && x.ativo); if(u) state.user=u; }
  const hp = await idbGet('h','pasta');
  if (hp){ try{ if(await hp.queryPermission({mode:'read'})==='granted'){ state.pasta=hp; } else state.pastaPend=hp; }catch(e){ state.pastaPend=hp; } }
  render();
  if (state.pasta && state.user) setTimeout(()=>scanPasta(false), 1200);
})();
</script>
